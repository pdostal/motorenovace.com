name: Docker

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve PHP version from Dockerfile
        run: echo "PHP_VERSION=$(sed -n 's/^FROM php:\([^-]*\)-.*/\1/p' Dockerfile)" >> "$GITHUB_ENV"
      - name: Lint PHP
        run: docker run --rm -v "$PWD":/src -w /src "php:${PHP_VERSION}-cli" sh -c 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Render checks
        run: docker run --rm -v "$PWD":/src -w /src "php:${PHP_VERSION}-cli" php tests/check.php
      - name: HTTP smoke test
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 8099:8099 -v "$PWD":/src -w /src "php:${PHP_VERSION}-cli" \
            php -S 0.0.0.0:8099 tests/router.php)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null || true' EXIT
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8099/ || { echo "server did not start"; exit 1; }
          expect() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' "http://127.0.0.1:8099$1")
            [ "$code" = "$2" ] || { echo "FAIL $1: got $code, expected $2"; cat /tmp/body; exit 1; }
            grep -qiE 'warning|deprecated|fatal|undefined' /tmp/body && { echo "FAIL $1: PHP error in body"; cat /tmp/body; exit 1; }
            echo "ok $1 $code"
          }
          expect / 200
          expect /Kontakt.html 200
          expect /Contact.html 200
          expect /V.html 200
          expect /In.html 200
          expect /Po.html 200
          expect /After.html 200
          expect /404.html 404
          expect /style.css 200
          expect /img/background.png 200
          expect /img/clock.png 200
          expect /flags/cz.svg 200
          redirect=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' 'http://127.0.0.1:8099/?lang=en')
          [ "$redirect" = "301 http://127.0.0.1:8099/Introduction.html" ] || { echo "FAIL lang redirect: $redirect"; exit 1; }
          echo "ok lang redirect: $redirect"

  build:
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: pdostal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            docker.io/pdostal/motorenovace:latest
            docker.io/pdostal/motorenovace:sha-${{ github.sha }}
